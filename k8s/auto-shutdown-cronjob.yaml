apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-shutdown-ai-services
spec:
  # 每天晚上 6點, 9點, 11點 (台灣時間 UTC+8)
  # 18:00 (UTC 10:00), 21:00 (UTC 13:00), 23:00 (UTC 15:00)
  schedule: "0 10,13,15 * * *"
  
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: auto-shutdown-sa
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "🛑 Auto-shutdown triggered at $(date)"
              
              # 1. 先刪除 HPA (HorizontalPodAutoscaler)，否則 HPA 會自動把服務叫醒 (minReplicas=1)
              echo "🔪 Deleting HPAs to prevent auto-scaling..."
              kubectl delete hpa embedding-nim-hpa pdf-agent-hpa reranking-nim-hpa --ignore-not-found=true
              
              echo "Scaling down all AI services to 0..."
              
              # 2. 停止 AI 服務 Deployment
              kubectl scale deployment embedding-nim --replicas=0 || true
              # Reranking now uses Gemini API (no deployment to scale down)
              kubectl scale deployment qdrant --replicas=0 || true
              kubectl scale deployment pdf-agent --replicas=0 || true
              
              echo "🔌 Deleting LoadBalancer Service completely to save costs..."
              kubectl delete svc pdf-agent-service --ignore-not-found=true

              echo "✅ AI services scaled down to 0"
              
              # 3. 停止監控服務 (Monitoring Namespace)
              echo "📉 Scaling down monitoring services..."
              kubectl scale deployment monitoring-grafana --replicas=0 -n monitoring || true
              kubectl scale statefulset prometheus-monitoring-kube-prometheus-prometheus --replicas=0 -n monitoring || true
              kubectl scale deployment monitoring-kube-state-metrics --replicas=0 -n monitoring || true
              
              echo "✅ Monitoring services scaled down to 0"
              echo "💰 All services stopped! GPU nodes and monitoring pods released."
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"
---
# ServiceAccount: 給 CronJob 權限去操作 Deployment
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-shutdown-sa
---
# ClusterRole: 定義可以做什麼 (scale deployments 和 statefulsets，跨所有 namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-scaler
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "patch", "update", "delete"]
---
# ClusterRoleBinding: 把 ClusterRole 綁定到 ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auto-shutdown-binding
subjects:
- kind: ServiceAccount
  name: auto-shutdown-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: deployment-scaler
  apiGroup: rbac.authorization.k8s.io
