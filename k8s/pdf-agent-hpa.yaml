apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdf-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdf-agent
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # 當 CPU 使用率超過 50% 時擴展
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70  # 當記憶體使用率超過 70% 時擴展
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # 30 秒後才擴展 (避免抖動)
      policies:
      - type: Percent
        value: 100  # 每次最多增加 100% (1 → 2 → 3)
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60  # 60 秒後才縮減 (避免頻繁縮減)
      policies:
      - type: Percent
        value: 50  # 每次最多減少 50%
        periodSeconds: 60
