apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-agent
  template:
    metadata:
      labels:
        app: pdf-agent
    spec:
      containers:
      - name: pdf-agent
        image: us-central1-docker.pkg.dev/gen-lang-client-0044574038/pdf-agent-repo/pdf-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        # 這裡設定環境變數，對應到 3.1 & 3.2 程式碼裡的設定
        - name: EMBEDDING_SERVICE_URL
          value: "http://nim-embedding:8000/v1/embeddings"
        # Reranking now uses Gemini API (GOOGLE_API_KEY from .env)
        # Qdrant 設定
        - name: USE_QDRANT
          value: "true"
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        # 確保 Streamlit 使用 8080 port
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-agent-service
spec:
  type: LoadBalancer # 如果在本地測試可用 NodePort，GKE 上建議用 LoadBalancer
  selector:
    app: pdf-agent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
