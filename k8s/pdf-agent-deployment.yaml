apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-agent
  template:
    metadata:
      labels:
        app: pdf-agent
    spec:
      containers:
      - name: pdf-agent
        # ⚠️ 注意: 這裡需要替換成你實際 push 到 Artifact Registry 的 image 路徑
        # 例如: asia-east1-docker.pkg.dev/YOUR-PROJECT-ID/repo-name/pdf-agent:latest
        image: pdf-agent:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        # 這裡設定環境變數，對應到 3.1 & 3.2 程式碼裡的設定
        - name: EMBEDDING_SERVICE_URL
          value: "http://nim-embedding:8000/v1/embeddings"
        - name: RERANKING_SERVICE_URL
          value: "http://nim-reranking:8000/v1/ranking"
        # Qdrant 設定
        - name: USE_QDRANT
          value: "true"
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        # 確保 Streamlit 使用 8080 port
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-agent-service
spec:
  type: LoadBalancer # 如果在本地測試可用 NodePort，GKE 上建議用 LoadBalancer
  selector:
    app: pdf-agent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
