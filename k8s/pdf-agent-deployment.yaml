apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-agent
  template:
    metadata:
      labels:
        app: pdf-agent
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: pdf-agent-sa
      containers:
      - name: pdf-agent
        image: us-east1-docker.pkg.dev/gen-lang-client-0044574038/pdf-agent-repo/pdf-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        - containerPort: 9090
        env:
        # 這裡設定環境變數，對應到 3.1 & 3.2 程式碼裡的設定
        - name: EMBEDDING_SERVICE_URL
          value: "http://nim-embedding:8000/v1/embeddings"
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-api-key
              key: GOOGLE_API_KEY
        - name: DB_PATH
          value: "/app/storage/sessions.db"
        # Qdrant 設定
        - name: USE_QDRANT
          value: "true"
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: GCS_BUCKET_NAME
          value: "my-pdf-files__spike688023"
        # 確保 Streamlit 使用 8080 port
        - name: PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 10
        resources:
          requests:
            cpu: "500m"
            memory: "2500Mi"  # 從 2Gi 提高，避免 baseline 就接近 HPA 門檻
          limits:
            cpu: "1000m"
            memory: "4Gi"
        volumeMounts:
        - name: storage-volume
          mountPath: /app/storage
      volumes:
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-agent-service
spec:
  type: ClusterIP  # 在 Start-AI.sh 啟動時會動態改為 LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: pdf-agent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http
  - protocol: TCP
    port: 9090
    targetPort: 9090
    name: metrics
