apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranking-nim
  labels:
    app: reranking-nim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reranking-nim
  template:
    metadata:
      labels:
        app: reranking-nim
    spec:
      containers:
      - name: reranking-nim
        # 使用 NVIDIA 官方提供的 Reranking NIM Image
        image: nvcr.io/nim/nvidia/llama-3.2-nv-rerankqa-1b-v2:latest
        ports:
        - containerPort: 8000
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key # 共用同一個 Secret
              key: NGC_API_KEY
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: nim-reranking
spec:
  selector:
    app: reranking-nim
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
