apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-nim
  labels:
    app: embedding-nim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-nim
  template:
    metadata:
      labels:
        app: embedding-nim
    spec:
      containers:
      - name: embedding-nim
        # 使用 NVIDIA 官方提供的 Embedding NIM Image
        image: nvcr.io/nim/nvidia/llama-3.2-nv-embedqa-1b-v2:latest
        ports:
        - containerPort: 8000
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key # 我們需要建立這個 Secret
              key: NGC_API_KEY
        resources:
          limits:
            nvidia.com/gpu: 1 # 必須要有 GPU
          requests:
            nvidia.com/gpu: 1
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4
---
apiVersion: v1
kind: Service
metadata:
  name: nim-embedding
spec:
  selector:
    app: embedding-nim
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
