apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-nim
  labels:
    app: embedding-nim
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU 資源有限，避免 rolling update 死鎖
  selector:
    matchLabels:
      app: embedding-nim
  template:
    metadata:
      labels:
        app: embedding-nim
    spec:
      imagePullSecrets:
      - name: ngc-secret
      containers:
      - name: embedding-nim
        # 使用 NVIDIA 官方提供的 Embedding NIM Image
        image: nvcr.io/nim/nvidia/llama-3.2-nv-embedqa-1b-v2:latest
        ports:
        - containerPort: 8000
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key # 我們需要建立這個 Secret
              key: NGC_API_KEY
        - name: NIM_LOG_LEVEL
          value: "DEBUG"
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        resources:
          limits:
            nvidia.com/gpu: 1 # 必須要有 GPU
            memory: "8Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi  # 設定 shared memory 大小
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
---
apiVersion: v1
kind: Service
metadata:
  name: nim-embedding
spec:
  selector:
    app: embedding-nim
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
